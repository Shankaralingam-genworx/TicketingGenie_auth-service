version: "3.9"

services:
  auth-service:
    build: .
    container_name: ticketing_auth_service
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    networks:
      - ticketing_net

  db:
    image: postgres:15-alpine
    container_name: ticketing_auth_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ticketing_net

volumes:
  postgres_data:

networks:
  ticketing_net:
    driver: bridge
